<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Portal - Access Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
               connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://*.supabase.co; 
               style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
               script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
               font-src 'self' https://cdnjs.cloudflare.com;">
</head>

<body class="bg-dark text-light">

    <div class="form-div">
        <form id="adminAuthForm" onsubmit="handleAdminAuth(event)">
            <label id="formHeading" class="d-block text-center fw-bold text-info fs-3 mb-3">Admin Login</label>

            <div class="mb-3 name-row" id="nameRow" style="display: none;">
                <input type="text" class="form-control bg-dark text-light border-secondary" id="fullname"
                    placeholder="Administrator Name">
            </div>

            <div class="mb-3">
                <input type="email" class="form-control bg-dark text-light border-secondary" id="email"
                    placeholder="admin@system.com" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control bg-dark text-light border-secondary" id="password"
                    placeholder="Admin Password" required>
            </div>

            <div class="mb-3 btn-row">
                <button type="submit" id="submitBtn" class="btn btn-info w-100 fw-bold">Authenticate Admin</button>
            </div>
        </form>

        <p class="text-center mt-3 small text-white">
            <span id="toggleText">Need to register a new admin?</span>
            <span class="toggle-link ms-1" id="toggleBtn" onclick="toggleAdminMode()"
                style="color: #22d3ee; cursor: pointer;">Register Admin</span>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="admin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="animations.js"></script>
</body>

</html>
