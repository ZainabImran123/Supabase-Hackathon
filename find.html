<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Study Partner</title>
    <link rel="stylesheet" href="find.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-900 text-slate-100 min-h-screen flex flex-col">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <!-- <button id="backBtn"
                class="text-cyan-400 hover:text-cyan-300 font-semibold text-sm transition flex items-center gap-1">
                ← Back
            </button> -->
            <div class="text-xl font-bold text-cyan-400">Study Partners</div>
        </div>

        <div class="flex items-center gap-4">
            <button id="toggleFormBtn"
                class="bg-cyan-500 hover:bg-cyan-400 text-gray-900 font-bold px-4 py-2 rounded-lg text-sm transition">
                + Post Request
            </button>
            <button id="logoutBtn" class="text-sm text-red-400 hover:text-red-300 transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 flex-1 w-full space-y-6">

        <div id="formModal"
            class="hidden bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-cyan-400">Find a Study Partner</h2>
                <button id="closeFormBtn" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <form id="partnerForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Subject / Course *</label>
                    <input type="text" id="subjectInput" required placeholder="e.g. Web Development, Calculus"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Topic or Goal *</label>
                    <textarea id="goalInput" required rows="3"
                        placeholder="e.g. Preparing for Supabase Hackathon, studying flexbox layout"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Preferred Time</label>
                        <input type="text" id="timeInput" placeholder="e.g. Weekends 4-6 PM"
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Contact Info *</label>
                        <input type="text" id="contactInput" required placeholder="e.g. Discord tag, WhatsApp number"
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancelFormBtn"
                        class="px-4 py-2 rounded-lg text-sm bg-gray-700 text-gray-300 hover:bg-gray-600 transition">Cancel</button>
                    <button type="submit" id="submitRequestBtn"
                        class="px-4 py-2 rounded-lg text-sm bg-cyan-500 hover:bg-cyan-400 text-gray-900 font-bold transition">Post
                        Request</button>
                </div>
            </form>
        </div>

        <section>
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <span>🤝</span> Active Study Requests
            </h2>
            <div id="requestsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-400 text-sm col-span-full">Loading study requests...</p>
            </div>
        </section>

    </main>

    <script src="find.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="animations.js"></script>
</body>

</html>
