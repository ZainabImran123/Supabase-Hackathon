<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login / Sign Up</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your Custom CSS File -->
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
               connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://*.supabase.co; 
               style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
               script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; 
               font-src 'self' https://cdnjs.cloudflare.com;">
</head>

<body>

    <div class="form-div">
        <form>
            <label id="formHeading" aria-hidden="true">Login</label>
            <br>
            <div class="mb-2 name-row" id="nameRow" style="display: none;">
                <input type="text" class="form-control" id="fullname" placeholder="full name">
            </div>

            <div class="mb-2">
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
            </div>
            <div class="mb-2">
                <input type="password" class="form-control" id="password" placeholder="password">
            </div>

            <div class="mb-2 flex btn-row">
                <button type="button" id="submitBtn">Log in</button>
            </div>
        </form>

        <p class="text-center mt-3 small text-white">
            <span id="toggleText">Don't have an account?</span>
            <span class="text-center toggle-link" id="toggleBtn" style="color: #22d3ee; cursor: pointer;">Create
                Account</span>
        </p>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JavaScript File -->
    <script src="app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="animations.js"></script>
</body>

</html>
