<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Polls</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="poll.css">
</head>

<body>

    <!-- Navbar with Auth State -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container" style="max-width: 650px;">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-square-poll-vertical me-2" style="color: var(--accent-blue);"></i>Poll System
            </a>
            <div class="d-flex align-items-center" id="authNavContainer">
                <!-- Auth state (user email + logout button or login link) will render here dynamically -->
                <span class="text-muted small">Checking auth status...</span>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 650px;">

        <div class="card poll-card p-4 mb-5">
            <h4 class="poll-title mb-3">
                <i class="fa-solid fa-plus-circle me-2"></i>Create a Poll
            </h4>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Poll Question</label>
                <input type="text" id="pollQuestion" class="form-control"
                    placeholder="e.g. Which framework do you prefer?">
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Options (Min 2)</label>
                <div id="optionsWrapper">
                    <input type="text" class="form-control mb-2 poll-option-input" placeholder="Option 1 (e.g. React)">
                    <input type="text" class="form-control mb-2 poll-option-input" placeholder="Option 2 (e.g. Vue)">
                </div>
                <button class="btn btn-add-option mt-1" onclick="addOptionInput()">
                    <i class="fa-solid fa-plus me-1"></i>Add Option
                </button>
            </div>

            <button class="btn btn-poll-submit w-100 mt-2" onclick="createPoll()">Publish Poll</button>
        </div>

        <h4 class="text-light fw-bold mb-3">
            <i class="fa-solid fa-fire me-2" style="color: var(--accent-blue);"></i>Active Polls
        </h4>
        <div id="pollsFeedContainer">
            <div class="text-center text-muted py-4">Loading polls...</div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="poll.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="animations.js"></script>
</body>

</html>
