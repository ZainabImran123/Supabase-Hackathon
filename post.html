<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="post.css">
    <script src="post.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-dark px-4 mb-4 d-flex justify-content-between align-items-center">
        <h3 class="navbar-brand fw-bold text-info m-0">
            <i class="fa-solid fa-layer-group me-2"></i>Community Posts
        </h3>
        <div class="position-relative">
            <button id="char" class="btn btn-info rounded-circle fw-bold" onclick="toggleMenu()">U</button>
            <div id="dropdownMenu"
                class="dropdown-menu dropdown-menu-end position-absolute mt-2 p-2 bg-dark border border-secondary">
                <button class="dropdown-item text-danger" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">

            <div class="col-md-5 mb-4">
                <div class="card custom-card p-4 shadow-lg">
                    <h4 id="formTitle" class="fw-bold mb-3 text-info">Create Post</h4>
                    <form id="postForm" onsubmit="post(event)">

                        <div class="mb-3">
                            <label for="title" class="form-label text-secondary small fw-bold">Title</label>
                            <input type="text" id="title" class="form-control" placeholder="Enter post title" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label text-secondary small fw-bold">Description</label>
                            <textarea id="description" class="form-control" rows="3" placeholder="What's on your mind?"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Image</label>
                            <div class="upload-btn-wrapper text-center">
                                <button type="button" class="upload-btn">
                                    <i class="fa-solid fa-plus fs-4 d-block mb-1"></i>
                                    <span id="uploadText">Add Image</span>
                                </button>
                                <input type="file" id="background-image" accept="image/*" onchange="previewImage(this)">
                            </div>

                            <div id="imagePreviewContainer" class="mt-3 d-none text-center">
                                <img id="imagePreview" src="" alt="Preview"
                                    class="img-fluid rounded border border-secondary"
                                    style="max-height: 250px; width: 100%; object-fit: cover;">
                            </div>
                        </div>

                        <button type="submit" id="postBtn" class="btn btn-info w-100 fw-bold py-2 mt-2">Publish
                            Post</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="input-group mb-4 shadow-sm">
                    <input type="text" id="searchInput" class="form-control py-2" placeholder="Search posts..."
                        onkeyup="searchPosts()">
                    <button class="btn btn-info px-4 fw-bold" onclick="searchPosts()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <div id="posts"></div>
            </div>

        </div>
    </div>

</body>

</html>
