<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="post.css">
    <script src="post.js" defer></script>
</head>

<body>

    <!-- Navbar Container -->
    <nav class="navbar px-4 py-3">
        <div class="container-fluid max-w-7xl d-flex align-items-center justify-content-between gap-3">

            <!-- Left: Brand Title -->
            <div class="d-flex align-items-center gap-2">
                <div class="stat-icon font-bold fs-5">S</div>
                <h1 class="fs-5 fw-bold text-white mb-0">Community <span class="accent-text">Posts</span></h1>
            </div>

            <!-- Center: Search Input -->
            <!-- <div class="flex-1 max-w-md d-none d-sm-block">
                <div class="position-relative d-flex align-items-center">
                    <input type="text" id="navSearchInput" placeholder="Search posts..."
                        class="form-control w-100 pe-5 text-sm" onkeyup="searchPosts('navSearchInput')">
                    <button class="btn btn-info position-absolute end-0 top-0 bottom-0 px-3 fw-bold rounded-start-0"
                        onclick="searchPosts('navSearchInput')">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div> -->

            <!-- Right: Profile Avatar & Logout Button -->
            <div class="d-flex align-items-center gap-3 shrink-0">
                <div class="w-9 h-9 rounded-circle bg-info text-dark fw-bold d-flex align-items-center justify-content-center text-sm shadow-sm"
                    style="width:36px; height:36px;">
                    A
                </div>

                <button id="logoutBtn"
                    class="btn px-3 py-1-5 rounded-3 text-xs fw-semibold d-flex align-items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>

        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container my-4">
        <div class="row">

            <!-- Left Column: Create Post Form -->
            <div class="col-md-5 mb-4">
                <div class="card custom-card p-4 shadow-lg">
                    <h4 id="formTitle" class="fw-bold mb-3 text-info">Create Post</h4>
                    <form id="postForm" onsubmit="post(event)">

                        <div class="mb-3">
                            <label for="title" class="form-label text-secondary small fw-bold">Title</label>
                            <input type="text" id="title" class="form-control" placeholder="Enter post title" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label text-secondary small fw-bold">Description</label>
                            <textarea id="description" class="form-control" rows="3" placeholder="What's on your mind?"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Image</label>
                            <div class="upload-btn-wrapper text-center">
                                <button type="button" class="upload-btn">
                                    <i class="fa-solid fa-plus fs-4 d-block mb-1"></i>
                                    <span id="uploadText">Add Image</span>
                                </button>
                                <input type="file" id="background-image" accept="image/*" onchange="previewImage(this)">
                            </div>

                            <div id="imagePreviewContainer" class="mt-3 d-none text-center">
                                <img id="imagePreview" src="" alt="Preview"
                                    class="img-fluid rounded border border-secondary"
                                    style="max-height: 250px; width: 100%; object-fit: cover;">
                            </div>
                        </div>

                        <button type="submit" id="postBtn" class="btn btn-info w-100 fw-bold py-2 mt-2">
                            Publish Post
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Posts Feed & Search -->
            <div class="col-md-7">
                <div class="input-group mb-4 shadow-sm">
                    <input type="text" id="feedSearchInput" class="form-control py-2" placeholder="Search posts..."
                        onkeyup="searchPosts('feedSearchInput')">
                    <button class="btn btn-info px-4 fw-bold" onclick="searchPosts('feedSearchInput')">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <div id="posts"></div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="animations.js"></script>

</body>

</html>
