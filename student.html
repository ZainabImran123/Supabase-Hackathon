<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-900 text-slate-100 min-h-screen">

    <!-- TOP NAVBAR -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="text-xl font-bold text-cyan-400">Student Portal</div>

        <div class="flex items-center gap-6">
            <!-- Notification Icon -->
            <button id="markReadBtn" class="relative text-gray-300 hover:text-white transition">
                🔔 <span id="statNotifications"
                    class="absolute -top-2 -right-2 bg-red-500 text-[10px] font-bold text-white rounded-full px-1.5 py-0.5">3</span>
            </button>

            <!-- Profile Dropdown -->
            <div class="relative group">
                <button
                    class="flex items-center gap-2 bg-gray-700 px-3 py-1.5 rounded-lg text-sm hover:bg-gray-650 transition">
                    <div
                        class="w-7 h-7 bg-cyan-500 rounded-full flex items-center justify-center font-bold text-gray-900">
                        👤</div>
                    <!-- Profile Badge Text (Replaces "ah") -->
                    <span id="profileBadgeName" class="font-medium text-slate-200">Student</span>
                    <span class="text-xs text-gray-400">▼</span>
                </button>

                <!-- Dropdown Menu -->
                <div
                    class="absolute right-0 mt-2 w-48 bg-gray-800 border border-gray-700 rounded-lg shadow-xl hidden group-hover:block z-50">
                    <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 rounded-t-lg">Profile
                        Settings</a>
                    <button id="logoutBtn"
                        class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-700 rounded-b-lg transition">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- LEFT & CENTER FEED (2 COLUMNS) -->
        <div class="md:col-span-2 space-y-6">

            <!-- Welcome Header Card -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-white">Welcome, <span id="userName"
                            class="text-cyan-400">Student</span>!</h1>
                    <p class="text-gray-400 text-sm mt-1">Explore all community activity, events, and announcements.</p>
                </div>
                <button id="createPostBtn"
                    class="bg-cyan-500 hover:bg-cyan-400 text-gray-900 font-bold px-4 py-2 rounded-lg text-sm transition">
                    + Create Post
                </button>
            </div>

            <!-- Page Navigation Quick Bar -->
            <div class="flex gap-4">
                <button id="createEventBtn"
                    class="bg-gray-800 hover:bg-gray-700 text-slate-200 border border-gray-700 px-4 py-2.5 rounded-lg text-sm flex-1 font-medium transition">
                    📅 Create Event
                </button>
                <button id="findPartnerBtn"
                    class="bg-gray-800 hover:bg-gray-700 text-slate-200 border border-gray-700 px-4 py-2.5 rounded-lg text-sm flex-1 font-medium transition">
                    🔍 Want to make Poll
                </button>
            </div>

            <!-- Posts Feed Section -->
            <div>
                <h2 class="text-lg font-semibold mb-4 text-cyan-400 flex items-center gap-2">
                    <span>💬</span> Community Feed
                </h2>
                <div id="postsContainer">
                    <p class="text-gray-500 text-sm">Loading posts...</p>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDEBAR (1 COLUMN) -->
        <div class="space-y-6">

            <!-- Campus Announcements Widget -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <h3 class="text-base font-semibold text-cyan-400 mb-3 flex items-center gap-2">
                    <span>📢</span> Announcements
                </h3>
                <div id="announcementsContainer">
                    <p class="text-gray-500 text-xs">Loading announcements...</p>
                </div>
            </div>

            <!-- Upcoming Events Widget -->
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <h3 class="text-base font-semibold text-cyan-400 mb-3 flex items-center gap-2">
                    <span>📅</span> Upcoming Events
                </h3>
                <div id="eventsContainer">
                    <p class="text-gray-500 text-xs">Loading events...</p>
                </div>
            </div>

        </div>

    </main>

    <script src="student.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="animations.js"></script>
</body>

</html>
